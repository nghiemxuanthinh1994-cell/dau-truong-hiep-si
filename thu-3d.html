<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1430">
<title>Đấu Trường 3D</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0d0a18;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;gap:10px;padding:0 12px;pointer-events:none}
  .hp{flex:1;max-width:46%;background:rgba(10,6,24,.72);border-radius:12px;padding:6px 10px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
  .hp b{display:block;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
  .hp.r{text-align:right}
  .bar{height:12px;border-radius:6px;background:#3a0d14;margin-top:4px;overflow:hidden;position:relative}
  .bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3fd36f,#8af07a);transition:width .25s}
  .hp.r .bar i{left:auto;right:0}
  .bar span{position:relative;font-size:10px;font-weight:700;display:block;text-align:center;line-height:12px;text-shadow:0 1px 2px #000}
  #banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.6);font-size:30px;font-weight:900;letter-spacing:1px;opacity:0;transition:transform .25s,opacity .25s;text-shadow:0 3px 0 #000,0 0 18px currentColor;pointer-events:none;white-space:nowrap}
  #banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .dmg{position:fixed;font-weight:900;font-size:22px;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.6);pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap}
  #end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(8,4,20,.55);backdrop-filter:blur(2px)}
  #end h2{margin:0;font-size:38px;color:#ffd040;text-shadow:0 4px 0 #6a3a00,0 0 24px #ffb000}
  .btn{border:0;border-radius:14px;padding:12px 22px;font-size:16px;font-weight:800;color:#2a1200;background:linear-gradient(#ffd060,#e08a1b);box-shadow:0 4px 0 #7a4200;cursor:pointer}
  .btn.s{background:linear-gradient(#5a4a8a,#33285a);color:#fff;box-shadow:0 4px 0 #160f2c}
  .note{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);text-align:center;font-size:11px;color:#b8acd8;pointer-events:none}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#cfc4f0}
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="hp"><b>Hiệp Sĩ</b><div class="bar"><i id="hpA" style="width:100%"></i><span id="hpAt"></span></div></div>
  <div class="hp r"><b id="nameO">Thằn Lằn Lửa</b><div class="bar"><i id="hpO" style="width:100%"></i><span id="hpOt"></span></div></div>
</div>
<div id="banner"></div>
<div id="end"><h2 id="endT">CHIẾN THẮNG!</h2><button class="btn" id="again">Đánh lại</button><button class="btn s" id="back">Về game</button></div>
<div class="note">Bản thử 3D · © 2026 Nghiêm Xuân Thịnh</div>
<div id="load">Đang dựng đấu trường 3D…</div>
<script type="module">
import * as THREE from 'three';
const IMG = '';
const $ = (id) => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1b2140');
scene.fog = new THREE.Fog('#1b1d38', 16, 34);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
const loader = new THREE.TextureLoader();
const tex = (f) => new Promise(res => loader.load(IMG + f, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; res(t); }, undefined, () => res(null)));
const cvTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };

// ===== Ánh sáng =====
scene.add(new THREE.HemisphereLight('#a8b8ff', '#3a2618', 0.55));
const sun = new THREE.DirectionalLight('#ffe6c0', 2.2); sun.position.set(-4, 9, 6); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 25 }); sun.shadow.bias = -0.0015;
scene.add(sun);
const flashLight = new THREE.PointLight('#fff2a0', 0, 12, 2); flashLight.position.set(2, 2, 0.5); scene.add(flashLight);

// ===== Sàn đấu: cát + vòng đá =====
const floorTex = cvTex(1024, 1024, (x, w, h) => {
  const g = x.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, w / 2); g.addColorStop(0, '#d9b47a'); g.addColorStop(1, '#a8834e'); x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(${90 + Math.random() * 60},${60 + Math.random() * 40},${30 + Math.random() * 20},${Math.random() * 0.18})`; x.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 4, 1 + Math.random() * 2); }
  x.strokeStyle = '#7d6a55'; x.lineWidth = 34; x.beginPath(); x.arc(w / 2, h / 2, w * 0.36, 0, Math.PI * 2); x.stroke();
  x.strokeStyle = '#a09080'; x.lineWidth = 6; for (let k = 0; k < 48; k++) { const a = k / 48 * Math.PI * 2; x.beginPath(); x.moveTo(w / 2 + Math.cos(a) * w * 0.34, h / 2 + Math.sin(a) * w * 0.34); x.lineTo(w / 2 + Math.cos(a) * w * 0.38, h / 2 + Math.sin(a) * w * 0.38); x.stroke(); }
  x.strokeStyle = 'rgba(255,240,200,.5)'; x.lineWidth = 4; x.beginPath(); x.arc(w / 2, h / 2, w * 0.12, 0, Math.PI * 2); x.stroke();
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(10, 96), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// ===== Tường chắn đá + khán đài (ảnh đấu trường có khán giả và cờ Việt Nam) =====
const wallTex = cvTex(1024, 256, (x, w, h) => {
  x.fillStyle = '#6e5a48'; x.fillRect(0, 0, w, h);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 16; c++) { const bw = w / 16, bh = h / 4, ox = (r % 2) * bw / 2; x.fillStyle = `hsl(28,${14 + Math.random() * 8}%,${32 + Math.random() * 10}%)`; x.fillRect(c * bw + ox + 3, r * bh + 3, bw - 6, bh - 6); }
  x.fillStyle = '#c9a050'; x.fillRect(0, 0, w, 10);
  for (let i = 0; i < 4; i++) { const fx = 60 + i * 256; x.fillStyle = '#da251d'; x.fillRect(fx, 30, 90, 60); x.fillStyle = '#ffde00'; x.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 9 : 22; x.lineTo(fx + 45 + Math.cos(a) * rr, 60 + Math.sin(a) * rr); } x.fill(); }
});
wallTex.wrapS = THREE.RepeatWrapping; wallTex.repeat.set(4, 1);
const wall = new THREE.Mesh(new THREE.CylinderGeometry(10, 10, 1.6, 96, 1, true), new THREE.MeshStandardMaterial({ map: wallTex, side: THREE.BackSide, roughness: 0.95 }));
wall.position.y = 0.8; wall.receiveShadow = true; scene.add(wall);

// ===== Đuốc: ánh lửa chập chờn =====
const flames = []; const torchLights = [];
async function makeTorches() {
  const frames = await Promise.all([0, 1, 2, 3, 4, 5].map(i => tex(`flame-${i}.webp`)));
  for (let i = 0; i < 6; i++) {
    const a = Math.PI * (0.15 + i * 0.14) + Math.PI, x = Math.cos(a) * 9.6, z = Math.sin(a) * 9.6;
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 1.2, 8), new THREE.MeshStandardMaterial({ color: '#3a2a1a' })); pole.position.set(x, 2.2, z); scene.add(pole);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: frames[0], transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); sp.scale.set(0.5, 0.7, 1); sp.position.set(x, 3.05, z); scene.add(sp);
    flames.push({ sp, frames, seed: i * 1.7 });
    if (i % 2 === 0) { const L = new THREE.PointLight('#ff9a40', 6, 9, 2); L.position.set(x * 0.95, 3, z * 0.95); scene.add(L); torchLights.push(L); }
  }
}

// ===== Cờ Việt Nam tung bay trên mép khán đài =====
const flagTex = cvTex(240, 160, (x, w, h) => { x.fillStyle = '#da251d'; x.fillRect(0, 0, w, h); x.fillStyle = '#ffde00'; x.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 19 : 48; x.lineTo(w / 2 + Math.cos(a) * rr, h / 2 + 6 + Math.sin(a) * rr); } x.fill(); });
const flags = [];
for (let i = 0; i < 5; i++) {
  const a = Math.PI * (0.18 + i * 0.16) + Math.PI, x = Math.cos(a) * 10.3, z = Math.sin(a) * 10.3;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 3.4, 6), new THREE.MeshStandardMaterial({ color: '#d8d0c0', metalness: 0.4, roughness: 0.4 })); pole.position.set(x, 3.1, z); scene.add(pole);
  const geo = new THREE.PlaneGeometry(1.5, 1, 16, 8); geo.translate(0.75, 0, 0);
  const fl = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: flagTex, side: THREE.DoubleSide, roughness: 0.8 })); fl.position.set(x, 4.25, z); fl.lookAt(0, 4.25, 0); fl.rotateY(Math.PI / 2); fl.castShadow = false;
  fl.userData.base = geo.attributes.position.array.slice(); scene.add(fl); flags.push(fl);
}

// ===== Khán đài phía sau: ảnh khán giả uốn cong thành vòng =====
async function makeStands() {
  const t = await tex('bg-dau-truong.webp'); if (!t) return;
  t.wrapS = THREE.MirroredRepeatWrapping; t.repeat.set(4, 0.6); t.offset.set(0, 0.36); // lặp đối xứng để không thấy đường nối
  const st = new THREE.Mesh(new THREE.CylinderGeometry(14, 11, 7.5, 96, 1, true), new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide, fog: true }));
  st.position.y = 4.6; scene.add(st);
  const sky = new THREE.Mesh(new THREE.SphereGeometry(40, 32, 16), new THREE.MeshBasicMaterial({ side: THREE.BackSide, map: cvTex(8, 256, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0c1030'); g.addColorStop(0.45, '#2a3a78'); g.addColorStop(0.55, '#e0905a'); g.addColorStop(1, '#2a1a28'); x.fillStyle = g; x.fillRect(0, 0, w, h); }), fog: false }));
  scene.add(sky);
}

// ===== Nhân vật: tấm ảnh đứng trong không gian 3D, luôn quay về camera, đổ bóng theo hình =====
function makeFighter(t, h, flip, x) {
  const w = h * t.image.width / t.image.height;
  const geo = new THREE.PlaneGeometry(w, h); geo.translate(0, h / 2, 0);
  const mat = new THREE.MeshStandardMaterial({ map: t, transparent: true, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.75, emissive: '#ffffff', emissiveMap: t, emissiveIntensity: 0 });
  const m = new THREE.Mesh(geo, mat); m.castShadow = true;
  m.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: t, alphaTest: 0.45 });
  if (flip) m.scale.x = -1;
  m.position.set(x, 0, 0); scene.add(m);
  const ring = new THREE.Mesh(new THREE.RingGeometry(w * 0.32, w * 0.42, 48), new THREE.MeshBasicMaterial({ color: flip ? '#ff6a2a' : '#5fa8ff', transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(x, 0.02, 0); scene.add(ring);
  return { m, mat, ring, home: x, hp: 0, max: 0, lunge: 0, kb: 0, flash: 0, dead: 0 };
}

// ===== Hạt tia lửa 3D =====
const PMAX = 600, pPos = new Float32Array(PMAX * 3), pCol = new Float32Array(PMAX * 3), parts = [];
const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const dot = cvTex(64, 64, (x, w) => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, '#fff'); g.addColorStop(0.3, 'rgba(255,255,255,.8)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, w, w); });
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.16, map: dot, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(points);
function burst(x, y, z, col, n, sp = 4, g = 6) { const c = new THREE.Color(col); for (let i = 0; i < n; i++) { if (parts.length >= PMAX) parts.shift(); const a = Math.random() * Math.PI * 2, e = Math.random() * Math.PI - Math.PI / 2, v = sp * (0.4 + Math.random()); parts.push({ x, y, z, vx: Math.cos(a) * Math.cos(e) * v, vy: Math.abs(Math.sin(e)) * v + 1, vz: Math.sin(a) * Math.cos(e) * v, life: 0.6 + Math.random() * 0.5, c, g }); } }

// ===== Tia sét 3D giáng xuống =====
const bolts = [];
function lightning(x) {
  const pts = []; let px = x + (Math.random() - 0.5) * 2, py = 12; const n = 18;
  for (let i = 0; i <= n; i++) { const k = i / n; pts.push(new THREE.Vector3(px + (x - px) * k + (i && i < n ? (Math.random() - 0.5) * 0.9 : 0), py * (1 - k) + 0.9 * k, (Math.random() - 0.5) * 0.5 * (i && i < n ? 1 : 0))); }
  const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.1);
  const core = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.035, 6), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true }));
  const glow = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.16, 8), new THREE.MeshBasicMaterial({ color: '#ffe14a', transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(core, glow); bolts.push({ core, glow, life: 0.45 });
  flashLight.position.set(x, 1.6, 0.6); flashLight.intensity = 60;
  burst(x, 0.3, 0, '#fff3a0', 60, 6); shake = 0.35;
}

// ===== Trận đấu =====
let A, O, turn = 0, timer = 1.2, over = false, shake = 0, zoom = 0, actions = 0, camOrbit = 0;
const dmgEls = [];
function showDmg(f, txt, col, big) { const el = document.createElement('div'); el.className = 'dmg'; el.textContent = txt; el.style.color = col; if (big) el.style.fontSize = '30px'; document.body.appendChild(el); dmgEls.push({ el, f, t: 0, off: (Math.random() - 0.5) * 0.6 }); }
function banner(txt, col) { const b = $('banner'); b.textContent = txt; b.style.color = col; b.classList.add('on'); clearTimeout(banner.t); banner.t = setTimeout(() => b.classList.remove('on'), 900); }
function setHP() { $('hpA').style.width = Math.max(0, A.hp / A.max * 100) + '%'; $('hpO').style.width = Math.max(0, O.hp / O.max * 100) + '%'; $('hpAt').textContent = `${Math.max(0, Math.round(A.hp))}/${A.max}`; $('hpOt').textContent = `${Math.max(0, Math.round(O.hp))}/${O.max}`; }
function reset() { over = false; turn = 0; timer = 1.2; actions = 0; for (const f of [A, O]) { f.hp = f.max; f.dead = 0; f.lunge = 0; f.kb = 0; f.m.rotation.z = 0; f.m.visible = true; } $('end').style.display = 'none'; setHP(); }
function attack(atk, def) {
  const isA = atk === A; actions++;
  const skill = isA ? actions % 3 === 0 : Math.random() < 0.28, crit = Math.random() < 0.2;
  atk.lunge = 1;
  setTimeout(() => {
    let d = Math.round((isA ? 34 : 26) * (0.85 + Math.random() * 0.3) * (crit ? 1.7 : 1) * (skill ? 1.6 : 1));
    def.hp -= d; def.flash = 1; def.kb = 1; shake = Math.max(shake, crit ? 0.25 : 0.12);
    const hx = def.m.position.x, col = skill ? (isA ? '#ffe14a' : '#ff7a1a') : '#ffffff';
    burst(hx, 1.3, 0.2, crit ? '#ffd040' : '#fff6d0', crit ? 40 : 22);
    if (skill && isA) { banner('⚡ SẤM SÉT', '#ffe14a'); lightning(hx); zoom = 1; }
    if (skill && !isA) { banner('🔥 PHUN LỬA', '#ff7a1a'); burst(hx, 1.2, 0.3, '#ff7a1a', 70, 5, 2); burst(hx, 1, 0.3, '#ffd060', 40, 3, 1); zoom = 1; flashLight.color.set('#ff8a30'); flashLight.position.set(hx, 1.4, 0.8); flashLight.intensity = 40; setTimeout(() => flashLight.color.set('#fff2a0'), 400); }
    showDmg(def, (crit ? 'CHÍ MẠNG ' : '') + '-' + d, col, crit || skill);
    setHP();
    if (def.hp <= 0) { over = true; def.dead = 0.001; setTimeout(() => { $('endT').textContent = def === O ? 'CHIẾN THẮNG!' : 'THẤT BẠI'; $('end').style.display = 'flex'; }, 1300); }
  }, 260);
}

// ===== Khung hình =====
let portrait = false;
function resize() { const w = innerWidth, h = innerHeight; portrait = w / h < 0.8; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = portrait ? 58 : 45; camera.updateProjectionMatrix();
  if (A && O) { A.home = portrait ? -1.12 : -1.7; O.home = portrait ? 1.12 : 1.7; } }
addEventListener('resize', resize);
let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  // camera: lượn nhẹ quanh sân, zoom sát khi ra kỹ năng
  zoom = Math.max(0, zoom - dt * 0.9); const amp = portrait ? 0.18 : 0.32; camOrbit += ((zoom > 0 ? amp * 1.6 : Math.sin(T * 0.18) * amp) - camOrbit) * Math.min(1, dt * 2.5);
  const dist = (portrait ? 7.6 : 8.6) - zoom * (portrait ? 0.9 : 2.2), cy = (portrait ? 2.7 : 2.5) - zoom * 0.5;
  camera.position.set(Math.sin(camOrbit) * dist, cy, Math.cos(camOrbit) * dist);
  if (shake > 0) { camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; shake = Math.max(0, shake - dt * 1.4); }
  camera.lookAt(zoom > 0 && O && !portrait ? O.m.position.x * 0.4 : 0, portrait ? 1.35 : 1.25, 0);
  if (A && O) {
    if (!over) { timer -= dt; if (timer <= 0) { attack(turn % 2 ? O : A, turn % 2 ? A : O); turn++; timer = 1.15; } }
    for (const f of [A, O]) {
      const dir = f === A ? 1 : -1;
      f.lunge = Math.max(0, f.lunge - dt * 2.6); f.kb = Math.max(0, f.kb - dt * 3.5); f.flash = Math.max(0, f.flash - dt * 4);
      const l = Math.sin(Math.min(1, f.lunge) * Math.PI) * 1.4;
      f.m.position.x = f.home + dir * l - dir * f.kb * 0.35; f.ring.position.x = f.m.position.x;
      f.m.position.y = Math.abs(Math.sin(T * 2.2 + f.home)) * 0.03;
      f.m.rotation.y = Math.atan2(camera.position.x - f.m.position.x, camera.position.z); // luôn quay mặt về camera
      f.mat.emissiveIntensity = f.flash * 0.9;
      if (f.dead > 0) { f.dead = Math.min(1, f.dead + dt * 1.6); f.m.rotation.z = -dir * f.dead * 1.35; f.ring.material.opacity = 0.55 * (1 - f.dead); }
      else f.ring.material.opacity = 0.4 + Math.sin(T * 4 + f.home) * 0.15;
    }
  }
  // hạt
  let n = 0; for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; } p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; if (p.y < 0.02) { p.y = 0.02; p.vy *= -0.3; } }
  for (const p of parts) { pPos[n * 3] = p.x; pPos[n * 3 + 1] = p.y; pPos[n * 3 + 2] = p.z; const k = Math.min(1, p.life * 2); pCol[n * 3] = p.c.r * k; pCol[n * 3 + 1] = p.c.g * k; pCol[n * 3 + 2] = p.c.b * k; n++; }
  pGeo.setDrawRange(0, n); pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
  // sét
  for (let i = bolts.length - 1; i >= 0; i--) { const b = bolts[i]; b.life -= dt; const fl = b.life > 0.3 || (b.life > 0.12 && b.life < 0.2) ? 1 : 0.25; b.core.material.opacity = fl; b.glow.material.opacity = 0.45 * fl; if (b.life <= 0) { scene.remove(b.core, b.glow); b.core.geometry.dispose(); b.glow.geometry.dispose(); bolts.splice(i, 1); } }
  flashLight.intensity = Math.max(0, flashLight.intensity - dt * 160);
  // đuốc + cờ
  for (const f of flames) { const k = Math.floor(T * 11 + f.seed * 3) % 6; f.sp.material.map = f.frames[k] || f.frames[0]; f.sp.scale.y = 0.65 + Math.sin(T * 13 + f.seed) * 0.06; }
  torchLights.forEach((L, i) => L.intensity = 5 + Math.sin(T * 17 + i * 3) * 1.2 + Math.random() * 0.8);
  for (const fl of flags) { const p = fl.geometry.attributes.position, b = fl.userData.base; for (let i = 0; i < p.count; i++) { const x = b[i * 3]; p.array[i * 3 + 2] = Math.sin(x * 3.2 - T * 5) * 0.12 * x; p.array[i * 3 + 1] = b[i * 3 + 1] + Math.sin(x * 2.4 - T * 4) * 0.04 * x; } p.needsUpdate = true; fl.geometry.computeVertexNormals(); }
  // số sát thương bay lên theo vị trí 3D
  for (let i = dmgEls.length - 1; i >= 0; i--) { const d = dmgEls[i]; d.t += dt; const v = new THREE.Vector3(d.f.m.position.x + d.off, 2.4 + d.t * 1.2, 0).project(camera); d.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; d.el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; d.el.style.opacity = String(Math.max(0, 1 - d.t / 1.1)); if (d.t > 1.1) { d.el.remove(); dmgEls.splice(i, 1); } }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ===== Khởi động =====
(async () => {
  resize();
  const [th, tm] = await Promise.all([tex('hs-5-huyen-thoai.webp'), tex('than-lan-lua.webp')]);
  await Promise.all([makeTorches(), makeStands()]);
  A = makeFighter(th, 2.3, false, -1.7); O = makeFighter(tm, 2.45, true, 1.7); // quái vẽ quay phải -> lật cho nhìn về hiệp sĩ
  A.max = 300; O.max = 260; resize(); reset();
  $('load').remove();
  requestAnimationFrame(frame);
})();
window.__state = () => ({ zoom, portrait, A: A && A.m.position.x, O: O && O.m.position.x });
window.__snap = () => { renderer.render(scene, camera); return canvas.toDataURL('image/jpeg', 0.85); }; // chụp khung hình để kiểm tra
$('again').onclick = reset;
$('back').onclick = () => { location.href = 'index.html'; };
</script>
